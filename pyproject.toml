[project]
name = "fransk"
version = "0.1.0"
description = "Franskleksjoner som podkast for rolige løpeturer"
requires-python = ">=3.12"
dependencies = ["edge-tts>=7.0", "pyyaml>=6.0"]

[project.scripts]
fransk = "fransk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
